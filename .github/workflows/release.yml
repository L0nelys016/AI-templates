name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover tests
      - run: python build.py
      - run: zip -j dist/macOS.zip Install.command dist/claude-templates.py
      - run: zip -j dist/Windows.zip Install.cmd dist/claude-templates.py
      - run: tar -czf dist/Linux.tar.gz Install.sh -C dist claude-templates.py
      - run: gh release create "$GITHUB_REF_NAME" dist/claude-templates.py dist/macOS.zip dist/Windows.zip dist/Linux.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
