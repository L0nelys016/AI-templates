name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover tests
      - run: python build.py
      - name: Publish Russian and English installers
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            --notes $'Русский: скачайте архив для своей ОС с суффиксом -ru.\nEnglish: download the archive for your OS with the -en suffix.'
        env:
          GH_TOKEN: ${{ github.token }}
